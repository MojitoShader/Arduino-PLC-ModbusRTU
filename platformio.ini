; PlatformIO Projekt: Arduino Opta RS485 -> MKS SERVO42D (Modbus RTU)
; Doku: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = opta

[env:opta]
platform = ststm32
board = opta                ; Cortex-M7 Kern des STM32H747 (Arduino mbed Core)
framework = arduino

; Opta wird per USB-C im DFU-Modus geflasht (Standard fuer dieses Board).
; Falls der Upload nicht startet: Reset-Taste am Opta 2x kurz druecken
; (gruene LED pulsiert = Bootloader aktiv) und erneut hochladen.
upload_protocol = dfu

; Serieller Monitor (USB-CDC, die Baudrate ist bei USB egal)
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter

lib_deps =
    arduino-libraries/ArduinoRS485
    arduino-libraries/ArduinoModbus
